<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light p-4">

<div class="container bg-white p-4 rounded shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="text-primary">🛠️ Quản Lý Khách Hàng & Thu Phí</h2>
        <a href="/" class="btn btn-outline-secondary" target="_blank">Xem Màn Hình LED</a>
    </div>

    <div class="row g-2 mb-4">
        <div class="col-md-4">
            <input type="text" id="fullname" class="form-control" placeholder="Họ và tên khách hàng">
        </div>
        <div class="col-md-4">
            <input type="text" id="plate" class="form-control" placeholder="Biển số xe (VD: 30A-12345)">
        </div>
        <div class="col-md-4">
            <button onclick="createUser()" class="btn btn-success w-100 fw-bold">➕ Thêm Khách Hàng</button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Họ Tên</th>
                    <th>Biển Số</th>
                    <th>Số Dư Ví</th>
                    <th>Hành Động</th>
                </tr>
            </thead>
            <tbody id="user-table">
                <tr><td colspan="4" class="text-center">Đang tải...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // --- LOAD DANH SÁCH USER ---
    async function loadUsers() {
 try {
 const res = await fetch('/users');
 const responseData = await res.json(); // Nhận toàn bộ response JSON
            
            // KIỂM TRA ĐỊNH DẠNG: Nếu có trường 'data' (do FastAPI bọc), thì lấy users từ đó.
            // Nếu không có 'data' (trả về list sạch), thì lấy nguyên cái list.
            const userList = responseData.data || responseData;

 const tbody = document.getElementById('user-table');
 tbody.innerHTML = '';
            
            // Đảm bảo là mảng trước khi dùng forEach (bắt lỗi Type Error)
            if (!Array.isArray(userList)) {
                 console.error("Lỗi: Dữ liệu trả về không phải là danh sách hợp lệ.", responseData);
                 tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger fw-bold">❌ Lỗi: Server trả về dữ liệu sai cấu trúc.</td></tr>';
                 return;
            }

            userList.forEach(u => {
                            // ... code vẽ bảng giữ nguyên ...
            const row = `
            <tr>
            <td class="fw-bold">${u.fullname}</td>
            <td><span class="badge bg-secondary fs-6">${u.plate_number}</span></td>
            <td class="text-success fw-bold">${u.balance.toLocaleString()} VNĐ</td>
            <td>
            <button class="btn btn-sm btn-primary me-1" onclick="transact('${u.plate_number}', 'add')">💵 Nạp Tiền</button>
            <button class="btn btn-sm btn-danger" onclick="transact('${u.plate_number}', 'deduct')">💸 Thu Phí</button>
            </td>
            </tr>
            `;
            tbody.innerHTML += row;
            });
            } catch (e) {
            console.error(e);
            }
            }

    // --- TẠO USER MỚI ---
    async function createUser() {
        const fullname = document.getElementById('fullname').value;
        const plate_number = document.getElementById('plate').value;

        if(!fullname || !plate_number) return Swal.fire('Lỗi', 'Nhập thiếu thông tin!', 'warning');

        const res = await fetch('/users/create', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ fullname, plate_number, balance: 0 })
        });

        if(res.ok) {
            Swal.fire('Thành công', 'Đã thêm khách hàng', 'success');
            loadUsers();
            document.getElementById('fullname').value = '';
            document.getElementById('plate').value = '';
        } else {
            const err = await res.json();
            Swal.fire('Lỗi', err.detail, 'error');
        }
    }

    // --- GIAO DỊCH (NẠP/RÚT) ---
    async function transact(plate, type) {
        const action = type === 'add' ? 'Nạp tiền' : 'Thu phí';
        const { value: amount } = await Swal.fire({
            title: `${action} xe ${plate}`,
            input: 'number',
            inputLabel: 'Nhập số tiền (VNĐ)',
            inputPlaceholder: 'Ví dụ: 50000',
            showCancelButton: true
        });

        if (amount) {
            const res = await fetch(`/users/transaction?type=${type}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ plate_number: plate, amount: parseInt(amount) })
            });

            if(res.ok) {
                Swal.fire('OK!', 'Giao dịch thành công', 'success');
                loadUsers();
            } else {
                const err = await res.json();
                Swal.fire('Toang!', err.detail, 'error');
            }
        }
    }

    // --- GIAO DỊCH 2: THU PHÍ (TÍNH THEO GIỜ/NGÀY) ---
    async function transactExit(plate) {
        const { value: hours } = await Swal.fire({
            title: `Thu Phí Xe ${plate} | Nhập Tổng Thời Gian Đỗ:`,
            input: 'number',
            inputLabel: 'Số giờ đỗ thực tế (Ví dụ: 25.5)',
            showCancelButton: true
        });

        if (hours) {
            // Gửi số giờ đỗ lên Backend để nó tự tính tiền và trừ
            const res = await fetch(`/users/transaction?type=deduct`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                // TRUYỀN THỜI GIAN ĐỖ LÊN (duraton_hours)
                body: JSON.stringify({ plate_number: plate, duration_hours: parseFloat(hours) }) 
            });
            
            if(res.ok) {
                const result = await res.json();
                const fee = result.fee_charged.toLocaleString();
                const days = result.days_parked;
                
                Swal.fire('Thu Phí Thành Công!', 
                          `Phí phải trả: ${fee} VNĐ (Đã trừ ${days} ngày)`, 
                          'success');
                loadUsers();
            } else {
                const err = await res.json();
                Swal.fire('Thất Bại!', err.detail, 'error');
            }
        }
    }
    // Chạy khi vào trang
    loadUsers();
</script>

</body>
</html>
