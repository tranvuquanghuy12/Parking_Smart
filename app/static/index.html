<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Tin Bãi Đỗ Xe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; }
        .header { background: #1f1f1f; padding: 20px; text-align: center; margin-bottom: 30px; border-bottom: 3px solid #0d6efd; }
        .slot-card {
            height: 180px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            transition: transform 0.2s;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }
        .slot-id { font-size: 3rem; }
        .slot-status { font-size: 1.5rem; text-transform: uppercase; }
        .empty { background-color: #198754; color: white; border: 2px solid #20c997; } /* Xanh */
        .occupied { background-color: #dc3545; color: white; border: 2px solid #ff6b6b; } /* Đỏ */
        .last-update { font-size: 0.8rem; opacity: 0.7; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h1>🅿️ TRẠM KIỂM SOÁT ĐỖ XE THÔNG MINH</h1>
    <p class="text-white-50">Dữ liệu cập nhật thời gian thực từ cảm biến IoT</p>
</div>

<div class="container">
    <div id="parking-grid" class="row g-4">
        <div class="text-center">Đang tải dữ liệu từ server...</div>
    </div>
</div>

<script>
    async function fetchSlots() {
        try {
            // Gọi API lấy danh sách chỗ đỗ
            const res = await fetch('/slots');
            const slots = await res.json();
            renderSlots(slots);
        } catch (err) {
            console.error(err);
        }
    }

    function renderSlots(slots) {
        const container = document.getElementById('parking-grid');
        container.innerHTML = ''; 

        if (slots.length === 0) {
            container.innerHTML = '<div class="text-center text-muted">Chưa có dữ liệu. Hãy khởi động thiết bị IoT!</div>';
            return;
        }

        slots.forEach(slot => {
            const isBusy = slot.is_occupied;
            const cls = isBusy ? 'occupied' : 'empty';
            const statusTxt = isBusy ? 'CÓ XE' : 'TRỐNG';
            
            const html = `
                <div class="col-md-3 col-6">
                    <div class="slot-card ${cls}">
                        <div class="slot-id">${slot.slot_id}</div>
                        <div class="slot-status">${statusTxt}</div>
                        <div class="last-update">🕒 ${slot.updated_at || 'Mới cập nhật'}</div>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    // Tự động cập nhật mỗi 2 giây
    fetchSlots();
    setInterval(fetchSlots, 2000);
</script>

</body>
</html>
